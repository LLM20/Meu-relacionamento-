<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#170a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nosso Amor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>💖 Chat do Amor 💖</title>
  <script src="app.js" defer></script>
  <script src="teste3.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teste2.css">
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <a href="index.html" class="app-back" aria-label="Voltar">&#8249;</a>
      <div class="app-header-avatar">💗</div>
      <div class="app-header-info">
        <h1>Seu Amor</h1>
        <span class="status"><span class="status-dot"></span>sempre pensando em você</span>
      </div>
    </header>

    <div id="chat" class="chat-scroll" role="log" aria-live="polite"></div>

    <div class="quick-suggestion">
      <button id="suggestionBtn">Sugestão de Amor 😘🤔</button>
    </div>

    <div id="inputArea" class="input-bar">
      <input type="text" id="messageInput" placeholder="Digite uma mensagem carinhosa... 💌" autocomplete="off" enterkeyhint="send" aria-label="Mensagem">
      <button id="sendBtn" aria-label="Enviar">➤</button>
    </div>
  </div>

  <div id="badge" role="status">🏆 Você é um falador apaixonado! 🎤💖</div>

</body>
</html>
